<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icon.png">
    <title>crm. Paweł Wlazły</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #F2EFE9;     
            --text-dark: #1A1A1A;   
            --accent-gold: #7D6B5D; 
            --border-color: #D1C7BC;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-dark);
            font-family: 'Libre Baskerville', serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 20px;
            bottom: 20px;
            left: 20px;
            right: 20px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            z-index: 50;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
            position: fixed;
            width: 100%;
            box-sizing: border-box;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-herb {
            height: 40px;
            filter: grayscale(1) contrast(1.1);
        }

        .nav-title {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .nav-title span {
            text-transform: lowercase;
            font-variant: normal;
            font-size: 0.85rem;
            margin-right: 6px;
            color: var(--accent-gold);
        }

        main {
            display: grid;
            grid-template-rows: auto 1fr auto;
            justify-items: center;
            height: 100vh;
            text-align: center;
            padding: 125px 40px 56px;
            box-sizing: border-box;
        }

        .main-top {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-herb-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            margin-bottom: 60px;
        }

        .main-herb-junosza {
            height: min(240px, 27vh);
            width: auto;
            transform: translateY(-34px);
        }

        .main-herb {
            height: min(240px, 27vh);
            opacity: 0.9;
        }

        .main-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .main-title-container.main-title-container--below {
            margin: 25px 0 0 0;
        }

        .main-title-line {
            width: 40px;
            height: 1px;
            background-color: var(--border-color);
        }

        .main-title-text {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 8px;
            color: var(--accent-gold);
            padding-left: 8px;
        }

        .main-name {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
        }

        .sub-name {
            font-family: 'Cinzel', serif;

            font-size: 2rem;
            align-self: center;
            margin: 0;
            color: var(--accent-gold);
            letter-spacing: 1px;
            max-width: 800px;
            line-height: 1.6;
        }

        .email-section {
            margin-top: 0;
            display: flex;
            gap: 30px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            align-items: center;
        }

        .email-link {
            color: var(--text-dark);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s ease, letter-spacing 0.3s ease;
        }

        .email-link:hover {
            opacity: 1;
            letter-spacing: 4px;
        }


        /* PC / landscape: herby niezależnie, przy lewej i prawej krawędzi strony */
        @media (min-width: 769px) and (orientation: landscape) {
            main { position: relative; padding-top: clamp(130px, 24vh, 220px); }

            .main-herb-container { display: contents; }

            .main-herb-junosza,
            .main-herb {
                position: absolute;
                top: clamp(110px, 19vh, 170px);
                height: min(340px, 42vh);
                max-width: 16vw;
                object-fit: contain;
            }

            .main-herb-junosza {
                left: clamp(80px, 7vw, 150px);
                transform: translateY(-14%);
            }

            .main-herb {
                right: clamp(80px, 7vw, 150px);
            }

            .main-name {
                font-size: clamp(2.2rem, 4vw, 4rem);
                letter-spacing: clamp(5px, 0.9vw, 12px);
                padding: 20px clamp(20px, 3vw, 40px);
            }
        }

        /* Responsywność */
        @media (max-width: 768px) {
            .main-name { font-size: 1.8rem; letter-spacing: 5px; padding: 15px 20px; }
            .main-title-text { font-size: 0.8rem; letter-spacing: 4px; padding-left: 4px; }
            .main-title-line { width: 20px; }
            .main-herb-container { gap: 24px; margin-bottom: 40px; }
            .main-herb-junosza { transform: translateY(-16px); }
            .main-herb, .main-herb-junosza { height: 100px; }
            main { height: auto; min-height: 100vh; padding: 120px 20px 60px; }
            .sub-name { font-size: 0.85rem; padding: 40px 10px; }
            .email-section { flex-direction: column; gap: 15px; }
            nav { padding: 30px; }
            body, html { overflow: auto; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <img src="icon.png" alt="Herb" class="nav-herb">
            <div class="nav-title"><span>crm.</span>Paweł Wlazły</div>
        </div>
    </nav>

    <main>
        <div class="main-top">
        <div class="main-herb-container">
            <img src="junosza.png" alt="Herb Junosza" class="main-herb-junosza">
            <img src="herb.png" alt="Herb Rodzinny" class="main-herb">
        </div>
        
        <div class="main-titles">
        <div class="main-title-container">
            <div class="main-title-line"></div>
            <div class="main-title-text">Ceremoniarz</div>
            <div class="main-title-line"></div>
        </div>

        <h1 class="main-name">Paweł Wlazły</h1>

        <div class="main-title-container main-title-container--below">
            <div class="main-title-line"></div>
            <div class="main-title-text">herbu Junosza</div>
            <div class="main-title-line"></div>
        </div>
        </div>

        </div>

        <div class="sub-name">«In Te, Domine, speravi»</div>

        <div class="email-section">
            <span id="mail-personal"></span>
        </div>
    </main>

    <script>
        function createSecureMail(id, user, domain) {
            var target = document.getElementById(id);
            if (!target) return;
            var email = user + "@" + domain;
            var link = document.createElement('a');
            link.href = "mailto:" + email;
            link.className = "email-link";
            link.innerText = email.toUpperCase();
            target.appendChild(link);
        }

        createSecureMail('mail-personal', 'personal', 'wlazly.com');
    </script>

</body>
</html>
